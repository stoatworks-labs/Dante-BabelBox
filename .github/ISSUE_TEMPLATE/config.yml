blank_issues_enabled: true
contact_links:
  - name: Report a problem without a GitHub account
    url: https://stoatworks-labs.com/feedback?project=Dante-BabelBox
    about: >
      The same bug, feature and field-report forms on the website. No account needed —
      it reaches the same place.

  - name: Ask a question or show what you built
    url: https://github.com/stoatworks-labs/Dante-BabelBox/discussions
    about: For anything that isn't a defect — questions, setups, ideas in progress.

  - name: Send a packet capture
    url: https://stoatworks-labs.com/captures?project=Dante-BabelBox
    about: >
      This project was built by reading the wire. If you have a device we don't, a
      capture of it working is the single most valuable thing you can contribute —
      read the privacy note first, captures carry real network addressing.

  - name: How to collect a diagnostics bundle
    url: https://github.com/stoatworks-labs/Dante-BabelBox/blob/main/docs/diagnostics.md
    about: One file with the logs, the version and the last crash in it.

  # GitHub's own private advisory form, NOT a mailto:. stoatworks-labs.com publishes no
  # MX record, so every @stoatworks-labs.com address bounces — a security contact that
  # silently discards reports is worse than having none, because the reporter believes
  # they have disclosed responsibly and starts their clock. This form needs no mail
  # infrastructure and is private by construction.
  - name: Report a security vulnerability privately
    url: https://github.com/stoatworks-labs/Dante-BabelBox/security/advisories/new
    about: >
      Please don't open a public issue for a vulnerability. This form is private and
      goes straight to the maintainer.
