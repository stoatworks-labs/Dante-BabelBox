# Generated by stoatworks-backend/scripts/sync-issue-templates.py — do not edit here.
# Edit the master in stoatworks-backend/issue-templates/ and re-run the sync.
name: Field report / feedback
description: Tell us how Dante BabelBox behaved on a real job — good or bad
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Most of these tools have been tested far more thoroughly against a simulator
        than against a room full of hardware at 8am. **A report that something worked
        is genuinely as useful as a report that it didn't** — it's the only way a
        project's status on the website goes from "field testing" to "field proven",
        and we'd rather say what's actually true than guess.

  - type: dropdown
    id: outcome
    attributes:
      label: How did it go?
      options:
        - It worked — no problems
        - It worked, with caveats
        - It mostly worked but something was awkward
        - It didn't work (a bug report may suit better)
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: What was the job?
      description: >
        Venue or setting, scale, and the kit it was talking to. As much or as little
        as you're able to share — no client names needed.
      placeholder: "Two-day conference, 600 seats, three ATEM Minis and a Dante rack."
    validations:
      required: true

  - type: textarea
    id: detail
    attributes:
      label: What worked, and what didn't
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "v0.3.1"

  - type: checkboxes
    id: quotable
    attributes:
      label: Attribution
      options:
        - label: >
            You may quote this on the website or in release notes. Leave unticked and
            it stays between us — it still shapes the roadmap either way.
          required: false
