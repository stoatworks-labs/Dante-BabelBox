name: Feature request
description: Suggest something Dante BabelBox should be able to do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        These tools exist because a real job needed them. The most persuasive feature
        request is a description of the job — what you were trying to get done, and
        what you had to do instead.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation, not the solution. What's the show, the rig, the deadline?
      placeholder: >
        Running four rooms off one console and I need to see at a glance which
        outputs have lost their source, without tabbing between windows.
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: What do you do at the moment?
      description: >
        Including "nothing, I just accept it". Knowing the current cost tells us how
        much the fix is worth.

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: If you already have a shape in mind, describe it. Entirely optional.

  - type: dropdown
    id: scale
    attributes:
      label: How often does this bite?
      options:
        - Every single time I use it
        - Most shows
        - Occasionally
        - Once, but it cost me badly
    validations:
      required: true
