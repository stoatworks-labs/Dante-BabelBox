# Generated by stoatworks-backend/scripts/sync-issue-templates.py — do not edit here.
# Edit the master in stoatworks-backend/issue-templates/ and re-run the sync.
name: Bug report
description: Something in Dante BabelBox is broken, crashes, or behaves wrongly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. The single most useful thing you can give us is
        **what you did, what you expected, and what actually happened** — in that
        order. Everything else below is a bonus.

        If this is a security problem, please don't file it here — use the private
        advisory form linked from "New issue" instead.

  - type: input
    id: version
    attributes:
      label: Version
      description: The version of Dante BabelBox you're running, and where you got it.
      placeholder: "v0.3.1, downloaded from the releases page"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows 11
        - Windows 10
        - Linux
        - Embedded / on-device
        - Other or not applicable
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, and what the tool did in response.
      placeholder: |
        1. Opened the app and connected to ...
        2. Clicked ...
        3. It froze for ten seconds and then showed "connection reset"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: hardware
    attributes:
      label: Hardware and network in play
      description: >
        Most of these tools talk to something else. Which device, which firmware, and
        how it's connected is often the whole answer — say "not applicable" if this
        one is purely local.
      placeholder: "d&b D80, firmware 2.14, on a flat VLAN with the laptop"

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics bundle
      description: >
        Dante BabelBox can bundle its own logs, version info and last crash into a single
        file — that one file usually answers every question we'd otherwise have to ask
        you one at a time. See [docs/diagnostics.md](https://github.com/stoatworks-labs/Dante-BabelBox/blob/main/docs/diagnostics.md) for how to collect one.
        Config values are redacted before the bundle is written, but do have a look
        before attaching it: paste the contents here, or drag the file into this box.
      render: text

  - type: textarea
    id: logs
    attributes:
      label: Anything in the log
      description: Error text, a stack trace, or the last few lines before it went wrong.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Before you file
      options:
        - label: I'm on the latest release, or I've said above why I can't be.
          required: false
        - label: I've searched the existing issues.
          required: false
