name: ci

# Until this existed the repo had no workflow with a `pull_request` trigger at
# all — only a tag-driven release — so Dependabot bumps arrived with no status
# check to gate a merge on and simply accumulated.
#
# `cargo fmt --check` is deliberately not a step: it is already failing on main
# (crates/core/src/channel_mapping.rs among others), and gating every bump on a
# pre-existing formatting drift would block the PRs this workflow exists to
# unblock. Run `cargo fmt --all` once, then add the step.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        # Two daemon tests are skipped, both of which pass locally and fail on a
        # clean checkout — which is the tell:
        #
        #   build_registry_loads_every_migrated_kind_from_a_real_plugins_dir
        #     scans a directory of built plugin cdylibs and expects all nine. On
        #     CI only two exist, because `cargo test` never promised to build the
        #     other seven — a developer machine passes it on artefacts left over
        #     from earlier builds.
        #
        #   bridges_phantom_change_from_dlive_to_dm3
        #     waits for a bridge to reach a mock dLive and times out on a runner
        #     slower than a laptop.
        #
        # Both are worth fixing rather than skipping; neither is a dependency
        # regression, which is what this gate is for.
        run: >
          cargo test --
          --skip daemon::tests::build_registry_loads_every_migrated_kind_from_a_real_plugins_dir
          --skip daemon::tests::bridges_phantom_change_from_dlive_to_dm3
