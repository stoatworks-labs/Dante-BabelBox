[workspace]
resolver = "2"
members = [
    "crates/diag",
    "crates/oca",
    "crates/oca-plugin-abi",
    "crates/ocp1",
    "crates/core",
    "crates/discovery",
    "crates/preamp-adapter-osc",
    "crates/preamp-adapter-ah",
    "crates/preamp-adapter-yamaha",
    "crates/plugin-osc-x32",
    "crates/plugin-osc-wing",
    "crates/plugin-ah-tcp",
    "crates/plugin-dlive-tcp",
    "crates/plugin-yamaha-dm3",
    "crates/plugin-rednet-aes70",
    "crates/preamp-cli",
    "crates/preamp-web",
    "crates/mic-core",
    "crates/mic-adapter-shure",
    "crates/mic-adapter-sennheiser",
    "crates/mic-adapter-lectrosonics",
    "crates/mic-adapter-shure-acn",
    "crates/mic-cli",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
axum = { version = "0.7", features = ["ws"] }
tower = { version = "0.5", features = ["util"] }
tokio-util = "0.7"
abi_stable = "0.11"

dante-babelbox-oca = { path = "crates/oca" }
dante-babelbox-oca-plugin-abi = { path = "crates/oca-plugin-abi" }
dante-babelbox-ocp1 = { path = "crates/ocp1" }
dante-babelbox-core = { path = "crates/core" }
dante-babelbox-discovery = { path = "crates/discovery" }
dante-babelbox-preamp-adapter-osc = { path = "crates/preamp-adapter-osc" }
dante-babelbox-preamp-adapter-ah = { path = "crates/preamp-adapter-ah" }
dante-babelbox-preamp-adapter-yamaha = { path = "crates/preamp-adapter-yamaha" }
dante-babelbox-preamp-web = { path = "crates/preamp-web" }
dante-babelbox-mic-core = { path = "crates/mic-core" }
dante-babelbox-mic-adapter-shure = { path = "crates/mic-adapter-shure" }
dante-babelbox-mic-adapter-sennheiser = { path = "crates/mic-adapter-sennheiser" }
dante-babelbox-mic-adapter-lectrosonics = { path = "crates/mic-adapter-lectrosonics" }
dante-babelbox-mic-adapter-shure-acn = { path = "crates/mic-adapter-shure-acn" }
