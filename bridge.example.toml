# Example bridge configuration. Copy to bridge.toml and edit for your rig.
#
# Built-in device kinds today:
#   "osc-x32"    Behringer X32/Wing-family sharing the X32 OSC dialect
#                (covers X32 and Midas M32/HD96) - ships as a loaded
#                plugin (crates/plugin-osc-x32), not compiled directly in
#   "rme-totalmix" RME TotalMix FX hardware outputs (e.g. a Digiface
#                Dante): channel N = output N, gain = its fader in dB,
#                -65 (off) to +6. `address` is the computer running
#                TotalMix, `port` 7001, `channels` required. A preamp
#                driving it needs `gain_offset_db` on the mapping (below)
#   "osc-wing"   Behringer Wing's own OSC dialect (console's 8 built-in
#                LCL preamps only for now - see adapter-osc's wing.rs)
#   "ah-tcp"     Allen & Heath AHM-series Dante/AES67 processors
#   "dlive-tcp"  Allen & Heath dLive consoles/MixRacks (physical preamp
#                "socket" addressing, channel = socket number 1-128)
#   "yamaha-dm3" Yamaha DM3/DM3S (official OSC spec; channel = Local
#                Input Num 1-16; gain is coarse integer dB, 0-64 only)
#   "yamaha-dm3-scp" Yamaha DM3/DM3S over SCP (TCP 49280) - RECOMMENDED:
#                confirmed reads/writes and a live NOTIFY change feed;
#                the one hardware-validated DM3 path. Same channel/gain
#                model as "yamaha-dm3". Prefer this over the OSC kind.
#   "sennheiser-ewg3" Sennheiser evolution-wireless G3 rack receiver
#                (EM 300/500 G3) over its binary WSM protocol (UDP 8133).
#                One channel whose "gain" is the receiver's analog AF-out
#                level (-24..+18 dB, 3 dB steps). Lets a console's remote
#                head-amp gain drive the receiver output. `address` is the
#                receiver's IP (front-panel Advanced > IP-Address); `port`
#                is ignored (fixed 8133). CLOSE Wireless Systems Manager
#                first - it holds the receiver's single write-master slot.
#   "yamaha-rio-emulated" An EMULATED Yamaha Rio3224-D2: the bridge is
#                the device. A CL/QL console sees a Rio, mounts it by
#                unit id and drives its head amps; each move is mapped
#                on like any other change. `address` is THIS machine's
#                own address on the Dante network (where the Rio will
#                appear), `unit_id` is required, `port` is ignored.
#                Built from a capture of a real QL1 and Rio; never run
#                against a console, and it carries no audio. On pairing
#                the console writes its own gain and +48 V to all 32
#                channels and the bridge relays them - read
#                docs/dante-emulation.md before mapping it to anything
#                with phantom power.
#   "aes70"      Any device speaking the AES70/OCA standard - written
#                against Focusrite RedNet (MP8R and any RedNet unit with
#                AES70 enabled), but not vendor-specific: the device's
#                objects are discovered when the bridge connects. On
#                RedNet, enable AES70 first in RedNet Control's
#                per-device Tools menu - RedNet Control does not need to
#                stay running afterwards. `channels` is ignored for this
#                kind, since a configured count could only contradict
#                what the unit itself reports. ("rednet-aes70" is still
#                accepted as an alias for older config files.)
#
# "ah-midi" (Qu/SQ) and "yamaha" (CL/QL/DM7, Rio/Tio) are not implemented
# yet - see the project task list for why. A kind can take settings of its
# own: any other key in a [[device]] table (number, string or boolean) is
# passed to that device's plugin. `kind` is an open string, not
# a fixed list - dropping a plugin `.so`/`.dylib`/`.dll` into the
# bridge's --plugins-dir (see README's "Plugin Architecture" section and
# docs/plugin-development-guide.md) registers additional kinds without
# needing this file's format, or this project, to change at all.
#
# The [[mapping]] entries below were written by hand. `preamp-bridge init
# --infer-mappings` can generate a first draft of these by observing live
# Dante audio routing instead - see the README's "Auto-generating
# bridge.toml" section for the caveat that comes with trusting them.

[[device]]
id = "ahm-rack"
kind = "ah-tcp"
address = "10.0.0.10"
port = 51325

[[device]]
id = "dlive-mixrack"
kind = "dlive-tcp"
address = "10.0.0.15"
port = 51325

[[device]]
id = "x32-monitors"
kind = "osc-x32"
address = "10.0.0.20"
port = 10023

[[device]]
id = "dm3-foh"
kind = "yamaha-dm3"
address = "10.0.0.25"
port = 49900

[[device]]
id = "rednet-stage"
kind = "aes70"
address = "10.0.0.30"
# AES70-3 assigns no port; 65000 is the usual convention. Confirm the real
# one via mDNS (_oca._tcp) rather than assuming it.
port = 65000

[[mapping]]
from = { device = "ahm-rack", channel = 3 }
to   = { device = "x32-monitors", channel = 7 }
bidirectional = true

[[mapping]]
from = { device = "dlive-mixrack", channel = 12 }
to   = { device = "x32-monitors", channel = 8 }
bidirectional = true

[[mapping]]
from = { device = "dlive-mixrack", channel = 20 }
to   = { device = "dm3-foh", channel = 5 }
bidirectional = true

# Gain is copied in dB. `gain_offset_db` shifts it on the way from -> to (and
# back, on a bidirectional mapping) when the two ranges don't line up: a
# preamp's -6..+66 dB onto an RME output fader's -65..+6 dB wants about -60,
# or the output sits at its top. Phantom is never offset. For example, with an
# `rme-totalmix` device "digiface" added above:
#
# [[mapping]]
# from = { device = "dm3-foh", channel = 2 }
# to   = { device = "digiface", channel = 1 }
# gain_offset_db = -60.0

# An emulated Rio for a Yamaha console to control, driving the Digiface
# output above from the console's own head-amp gain. Uncomment both, and
# set `address` to this machine's address on the Dante network:
#
# [[device]]
# id = "virtual-rio"
# kind = "yamaha-rio-emulated"
# address = "169.254.10.20"
# unit_id = 5               # the console mounts it as Y005; must be free
#
# [[mapping]]
# from = { device = "virtual-rio", channel = 3 }
# to   = { device = "digiface", channel = 1 }
# gain_offset_db = -60.0

# Gain compensation ("gain lock") - see docs/GAIN-LOCK.md. One desk leads the
# shared preamps; while locked, each follower desk's input trim takes the
# opposite of every leader gain change. Followers today: osc-x32 (inputs 1-32)
# and osc-wing (channels 1-40). Uncomment to try it with the devices above:
#
# [gain_lock]
# leader = "dlive-mixrack"
# lock_on_start = false     # true: lock as soon as the devices connect
# poll_ms = 0               # >0: also re-read leader gains, for a leader that doesn't push
#
# [[gain_lock.signal]]
# name = "Kick In"
# members = [
#   { device = "dlive-mixrack", preamp = 1 },   # the leader's preamp (a dLive socket)
#   { device = "x32-monitors", input = 1 },     # the follower's input channel trim
# ]
