# Example bridge configuration. Copy to bridge.toml and edit for your rig.
#
# Built-in device kinds today:
#   "osc-x32"    Behringer X32/Wing-family sharing the X32 OSC dialect
#                (covers X32 and Midas M32/HD96) - ships as a loaded
#                plugin (crates/plugin-osc-x32), not compiled directly in
#   "osc-wing"   Behringer Wing's own OSC dialect (console's 8 built-in
#                LCL preamps only for now - see adapter-osc's wing.rs)
#   "ah-tcp"     Allen & Heath AHM-series Dante/AES67 processors
#   "dlive-tcp"  Allen & Heath dLive consoles/MixRacks (physical preamp
#                "socket" addressing, channel = socket number 1-128)
#   "yamaha-dm3" Yamaha DM3/DM3S (official OSC spec; channel = Local
#                Input Num 1-16; gain is coarse integer dB, 0-64 only)
#   "yamaha-dm3-scp" Yamaha DM3/DM3S over SCP (TCP 49280) - RECOMMENDED:
#                confirmed reads/writes and a live NOTIFY change feed;
#                the one hardware-validated DM3 path. Same channel/gain
#                model as "yamaha-dm3". Prefer this over the OSC kind.
#   "sennheiser-ewg3" Sennheiser evolution-wireless G3 rack receiver
#                (EM 300/500 G3) over its binary WSM protocol (UDP 8133).
#                One channel whose "gain" is the receiver's analog AF-out
#                level (-24..+18 dB, 3 dB steps). Lets a console's remote
#                head-amp gain drive the receiver output. `address` is the
#                receiver's IP (front-panel Advanced > IP-Address); `port`
#                is ignored (fixed 8133). CLOSE Wireless Systems Manager
#                first - it holds the receiver's single write-master slot.
#   "aes70"      Any device speaking the AES70/OCA standard - written
#                against Focusrite RedNet (MP8R and any RedNet unit with
#                AES70 enabled), but not vendor-specific: the device's
#                objects are discovered when the bridge connects. On
#                RedNet, enable AES70 first in RedNet Control's
#                per-device Tools menu - RedNet Control does not need to
#                stay running afterwards. `channels` is ignored for this
#                kind, since a configured count could only contradict
#                what the unit itself reports. ("rednet-aes70" is still
#                accepted as an alias for older config files.)
#
# "ah-midi" (Qu/SQ) and "yamaha" (CL/QL/DM7, Rio/Tio) are not implemented
# yet - see the project task list for why. `kind` is an open string, not
# a fixed list - dropping a plugin `.so`/`.dylib`/`.dll` into the
# bridge's --plugins-dir (see README's "Plugin Architecture" section and
# docs/plugin-development-guide.md) registers additional kinds without
# needing this file's format, or this project, to change at all.
#
# The [[mapping]] entries below were written by hand. `preamp-bridge init
# --infer-mappings` can generate a first draft of these by observing live
# Dante audio routing instead - see the README's "Auto-generating
# bridge.toml" section for the caveat that comes with trusting them.

[[device]]
id = "ahm-rack"
kind = "ah-tcp"
address = "10.0.0.10"
port = 51325

[[device]]
id = "dlive-mixrack"
kind = "dlive-tcp"
address = "10.0.0.15"
port = 51325

[[device]]
id = "x32-monitors"
kind = "osc-x32"
address = "10.0.0.20"
port = 10023

[[device]]
id = "dm3-foh"
kind = "yamaha-dm3"
address = "10.0.0.25"
port = 49900

[[device]]
id = "rednet-stage"
kind = "aes70"
address = "10.0.0.30"
# AES70-3 assigns no port; 65000 is the usual convention. Confirm the real
# one via mDNS (_oca._tcp) rather than assuming it.
port = 65000

[[mapping]]
from = { device = "ahm-rack", channel = 3 }
to   = { device = "x32-monitors", channel = 7 }
bidirectional = true

[[mapping]]
from = { device = "dlive-mixrack", channel = 12 }
to   = { device = "x32-monitors", channel = 8 }
bidirectional = true

[[mapping]]
from = { device = "dlive-mixrack", channel = 20 }
to   = { device = "dm3-foh", channel = 5 }
bidirectional = true
